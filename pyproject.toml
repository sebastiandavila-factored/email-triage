[project]
name = "email-triage"
version = "0.1.0"
description = "AI email triage API: classify support emails and draft replies"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "bcrypt>=4.2",
    "cryptography>=50.0",
    "fastapi-cloud-cli>=0.23.0",
    "fastapi[standard]>=0.136.3",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2",
    "joserfc>=1.7.1",
    "logfire[fastapi,httpx,system-metrics]>=4.34.0",
    "pydantic-ai-slim[groq]>=1.106.0,<2",
    "pydantic-evals>=1.106.0,<2",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0",
]

[project.scripts]
triage-mcp = "email_triage.mcp_server:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mcp>=2.0",  # for the MCP server (F4) — tests + typecheck
    "pre-commit>=4.6.0",
    "pyright[nodejs]>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_triage"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["email_triage", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every test is auto-marked in tests/conftest.py: "e2e" if it drives the full app
# or a real DB engine, "unit" otherwise. CI runs them as separate jobs
# (`pytest -m unit` / `pytest -m e2e`). --strict-markers turns a typo into an error.
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated test with no app/DB fixtures",
    "e2e: exercises the full app (TestClient) or a real DB engine",
]

[tool.pyright]
include = ["email_triage", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.fastapi]
entrypoint = "email_triage.main:app"
