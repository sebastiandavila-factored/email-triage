name: Frontend CI

# No `paths:` filter on the triggers — the workflow ALWAYS runs, so the `gate`
# job below always reports a status and can be a *required* check on `main`
# without deadlocking backend-only PRs. The expensive jobs are gated internally
# by the `changes` job instead (they skip when frontend/ is untouched).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists changed files on PRs

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # Detect whether this push/PR touches the frontend (or this workflow).
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Typecheck as its own signal (separate from the Vite bundle step below).
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

  test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Typecheck the test + tooling files that the prod build excludes.
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Unit tests (Vitest)
        run: npm run test

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      # Playwright serves the built app via `vite preview` (see playwright.config.ts).
      - name: Build
        run: npm run build
      - name: E2E tests (Playwright)
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Single status to mark as the required check on `main`. Always runs; passes
  # when every real job succeeded OR was skipped (frontend/ untouched), and fails
  # only if one actually failed or was cancelled.
  gate:
    needs: [changes, lint, build, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks to pass (or be skipped)
        # No checkout here, so override the workflow's `frontend` working-dir default
        # (that path doesn't exist without a checkout).
        working-directory: ${{ github.workspace }}
        run: |
          results="changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} build=${{ needs.build.result }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }}"
          echo "$results"
          for kv in $results; do
            case "${kv#*=}" in
              failure|cancelled)
                echo "::error::A frontend check did not pass ($kv)"
                exit 1
                ;;
            esac
          done
          echo "All frontend checks passed or were skipped."
