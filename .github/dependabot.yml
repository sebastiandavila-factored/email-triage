version: 2
updates:
  # Python deps (reads pyproject.toml + uv.lock via native uv support).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch routine bumps into one PR; security patches still open on their own.
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend deps (Vite/React) live under /frontend.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # Keep the workflow actions themselves current (checkout, setup-uv, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
